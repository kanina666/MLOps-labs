[project]
name = "mlops-labs"
version = "0.1.0"
description = "Async FastAPI service with health-checks for MLOps labs"
readme = "README.md"
authors = [
    { name = "nina", email = "ninakonkova19@yandex.ru" }
]
requires-python = ">=3.12"
dependencies = []

[build-system]
requires = ["uv_build>=0.12.15,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
eda = [
    "numpy==2.2.6",
    "pandas==2.3.3",
    "matplotlib==3.10.7",
    "seaborn==0.13.2",
    "scipy==1.16.2",
    "statsmodels==0.14.5",
    "nbformat==5.10.4",
    "nbclient==0.10.2",
    "nbconvert==7.16.6",
    "ipykernel==7.1.0",
    "jupyterlab==4.4.10",
    "requests==2.32.5",
    "mlflow-skinny==2.22.0",
]
dev = [
    "httpx>=0.28.1",
    "mypy>=2.3.1",
    "pandas-stubs>=2.3,<2.4",
    "pre-commit>=4.6.2",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.7",
]
web = [
    "asyncpg>=0.31.0",
    "fastapi>=0.141.1",
    "pydantic-settings>=2.15.0",
    "sqlalchemy>=2.0.53",
    "uvicorn[standard]>=0.53.0",
    "mlflow==2.22.0",
    "scikit-learn>=1.6.1",
    "numpy>=2.2.0"
]

[tool.uv]
default-groups = ["dev", "web"]

[tool.ruff]
line-length = 100
target-version = "py312"
exclude = [".venv", ".venv-eda", "migrations", "__pycache__", "notebooks/*.ipynb", "reports"]

[tool.ruff.lint]
select = [
    "E",     # pycodestyle errors
    "F",     # неиспользуемые импорты
    "W",     # pycodestyle warnings
    "I",     # isort (сортировка импортов)
    "N",     # pep8-naming
    "UP",    # pyupgrade (современный синтаксис)
    "B",     # flake8-bugbear (частые баги)
    "C4",    # flake8-comprehensions
    "SIM",   # flake8-simplify
    "ASYNC", # блокирующие вызовы внутри async-кода (важно для event loop)
    "PT",    # flake8-pytest-style
    "S",     # flake8-bandit (базовая безопасность)
]
ignore = [
    "E501", # длина строки контролирует formatter
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"] # assert в тестах - норма

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.coverage.run]
source = ["src/mlops_labs"]
branch = true

[tool.coverage.report]
fail_under = 80
show_missing = true
