include:
  - observability/compose.yaml

x-telemetry-env: &telemetry-env
  LOG_LEVEL: ${LOG_LEVEL:-INFO}
  LOG_ENV: ${DEPLOYMENT_ENV:-dev}
  OTEL_RESOURCE_ATTRIBUTES: ${OTEL_RESOURCE_ATTRIBUTES:-service.version=${APP_VERSION:-0.1.0},deployment.environment.name=${DEPLOYMENT_ENV:-dev}}
  OTEL_SDK_DISABLED: ${OTEL_SDK_DISABLED:-false}
  OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-http://otel-collector:4318}
  OTEL_EXPORTER_OTLP_TIMEOUT: ${OTEL_EXPORTER_OTLP_TIMEOUT:-0.5}
  OTEL_TRACES_SAMPLER: ${OTEL_TRACES_SAMPLER:-parentbased_always_on}
  OTEL_TRACES_SAMPLER_ARG: ${OTEL_TRACES_SAMPLER_ARG:-}
  OTEL_TRACES_EXPORTER: ${OTEL_TRACES_EXPORTER:-otlp}
  OTEL_METRICS_EXPORTER: ${OTEL_METRICS_EXPORTER:-otlp}
  OTEL_METRIC_EXPORT_INTERVAL: ${OTEL_METRIC_EXPORT_INTERVAL:-2000}
  OTEL_METRIC_EXPORT_TIMEOUT: ${OTEL_METRIC_EXPORT_TIMEOUT:-1000}
  OTEL_BSP_MAX_QUEUE_SIZE: ${OTEL_BSP_MAX_QUEUE_SIZE:-2048}
  OTEL_BSP_SCHEDULE_DELAY: ${OTEL_BSP_SCHEDULE_DELAY:-1000}

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: mlops_labs
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d mlops_labs"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 3s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
        reservations:
          cpus: "0.25"
          memory: 256M
    networks:
      - mlopslabs_network
    restart: unless-stopped

  rabbitmq:
    image: rabbitmq:3.13.7-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-guest}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-guest}
    ports:
      - "${RABBITMQ_PORT:-5672}:5672"        # AMQP
      - "${RABBITMQ_MGMT_PORT:-15672}:15672" # Web UI
      - "${RABBITMQ_PROM_PORT:-15692}:15692" # Prometheus
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
      - ./observability/rabbitmq-enabled-plugins:/etc/rabbitmq/enabled_plugins:ro
    healthcheck:
      test: ["CMD", "su-exec", "rabbitmq", "rabbitmq-diagnostics", "-q", "check_port_connectivity"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
        reservations:
          cpus: "0.25"
          memory: 128M
    networks:
      - mlopslabs_network
    restart: unless-stopped

  app:
    image: ${APP_IMAGE:-mlops-labs:local}
    pull_policy: never
    build:
      context: .
      dockerfile: Dockerfile
      args:
        APP_VERSION: ${APP_VERSION:-}
        VCS_REF: ${VCS_REF:-local}
    ports:
      - "${APP_PORT:-8000}:8000"
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      mlflow:
        condition: service_healthy
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz').read()\" || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1G
        reservations:
          cpus: "0.25"
          memory: 128M
    environment:
      <<: *telemetry-env
      OTEL_SERVICE_NAME: ${API_OTEL_SERVICE_NAME:-api}
      DATABASE_URL: "postgresql+asyncpg://postgres:postgres@postgres:5432/mlops_labs"
      RABBITMQ_URL: ${RABBITMQ_URL:-amqp://guest:guest@rabbitmq:5672/}
      MLFLOW_TRACKING_URI: ${MLFLOW_TRACKING_URI:-http://mlflow:5000}
      MODEL_URI: ${MODEL_URI:-models:/m5_sales_model@champion}
      M5_DATA_DIR: /data/raw
      RABBITMQ_QUEUE: ${RABBITMQ_QUEUE:-mlops.tasks}
      RABBITMQ_DLQ_QUEUE: ${RABBITMQ_DLQ_QUEUE:-mlops.tasks.dlq}
      # Buffer: 2 workers * ceil(1s retry pause / 0.2s inference) = 10
      # Use the same limit for all publishers and workers
      RABBITMQ_MAX_QUEUE_LENGTH: ${RABBITMQ_MAX_QUEUE_LENGTH:-10}
      PUBLISH_TIMEOUT_SECONDS: ${PUBLISH_TIMEOUT_SECONDS:-0.5}
      INFERENCE_DELAY_MS: ${INFERENCE_DELAY_MS:-200.0}
      WORKER_CONCURRENCY: ${WORKER_CONCURRENCY:-1}
      RETRY_AFTER_SECONDS: ${RETRY_AFTER_SECONDS:-}
    volumes:
      - ${M5_DATA_ROOT:-../data}:/data:ro
    networks:
      - mlopslabs_network
    restart: unless-stopped

  worker:
    image: ${APP_IMAGE:-mlops-labs:local}
    pull_policy: never
    command: python -m mlops_labs.worker
    stop_grace_period: ${WORKER_STOP_GRACE_PERIOD:-45s}
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=2).read()\""]
      interval: 5s
      timeout: 3s
      retries: 3
      start_period: 30s
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      mlflow:
        condition: service_healthy
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1G
        reservations:
          cpus: "0.25"
          memory: 128M
    environment:
      <<: *telemetry-env
      OTEL_SERVICE_NAME: ${WORKER_OTEL_SERVICE_NAME:-worker}
      MLFLOW_ENABLE_ARTIFACTS_PROGRESS_BAR: 'false'
      DATABASE_URL: "postgresql+asyncpg://postgres:postgres@postgres:5432/mlops_labs"
      RABBITMQ_URL: ${RABBITMQ_URL:-amqp://guest:guest@rabbitmq:5672/}
      MLFLOW_TRACKING_URI: ${MLFLOW_TRACKING_URI:-http://mlflow:5000}
      MODEL_URI: ${MODEL_URI:-models:/m5_sales_model@champion}
      INFERENCE_DELAY_MS: ${INFERENCE_DELAY_MS:-200.0}
      RABBITMQ_QUEUE: ${RABBITMQ_QUEUE:-mlops.tasks}
      RABBITMQ_DLQ_QUEUE: ${RABBITMQ_DLQ_QUEUE:-mlops.tasks.dlq}
      RABBITMQ_MAX_QUEUE_LENGTH: ${RABBITMQ_MAX_QUEUE_LENGTH:-10}
      RABBITMQ_PREFETCH_COUNT: ${RABBITMQ_PREFETCH_COUNT:-1}
      WORKER_CONCURRENCY: ${WORKER_CONCURRENCY:-1}
      MAX_RETRIES: ${MAX_RETRIES:-3}
      RETRY_DELAY_SECONDS: ${RETRY_DELAY_SECONDS:-0.2}
    networks:
      - mlopslabs_network
    restart: unless-stopped

  source:
    profiles: ["tools"]
    image: ${APP_IMAGE:-mlops-labs:local}
    pull_policy: never
    read_only: true
    command: python -m mlops_labs.source --input /data/batch.jsonl
    depends_on:
      rabbitmq:
        condition: service_healthy
    environment:
      <<: *telemetry-env
      OTEL_SERVICE_NAME: ${SOURCE_OTEL_SERVICE_NAME:-source}
      RABBITMQ_URL: ${RABBITMQ_URL:-amqp://guest:guest@rabbitmq:5672/}
      RABBITMQ_QUEUE: ${RABBITMQ_QUEUE:-mlops.tasks}
      RABBITMQ_DLQ_QUEUE: ${RABBITMQ_DLQ_QUEUE:-mlops.tasks.dlq}
      RABBITMQ_MAX_QUEUE_LENGTH: ${RABBITMQ_MAX_QUEUE_LENGTH:-10}
      PUBLISH_TIMEOUT_SECONDS: ${PUBLISH_TIMEOUT_SECONDS:-0.5}
      SOURCE_RETRY_DELAY_SECONDS: ${SOURCE_RETRY_DELAY_SECONDS:-0.05}
      SOURCE_RETRY_MAX_DELAY_SECONDS: ${SOURCE_RETRY_MAX_DELAY_SECONDS:-1.0}
    volumes:
      - ${BATCH_DATA_ROOT:-./data}:/data:ro
    healthcheck:
      disable: true
    networks:
      - mlopslabs_network

  # ---------- MLflow ----------
  # Backend Store: метаданные (эксперименты, runs, параметры, метрики) -> отдельный PostgreSQL
  mlflow_db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${MLFLOW_DB_USER:-mlflow}
      POSTGRES_PASSWORD: ${MLFLOW_DB_PASSWORD:-mlflow}
      POSTGRES_DB: ${MLFLOW_DB_NAME:-mlflow}
    volumes:
      - mlflow_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${MLFLOW_DB_USER:-mlflow} -d ${MLFLOW_DB_NAME:-mlflow}"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 3s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - mlopslabs_network
    restart: unless-stopped

  # Artifact Store: модели, файлы, графики -> S3-совместимое хранилище MinIO
  minio:
    image: rustfs/rustfs:1.0.0
    environment:
      RUSTFS_ACCESS_KEY: ${MINIO_ROOT_USER:-minioadmin}
      RUSTFS_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin}
    ports:
      - "${MINIO_PORT:-9100}:9000"
      - "${MINIO_CONSOLE_PORT:-9101}:9001"
    volumes:
      - minio_data:/data
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - mlopslabs_network
    restart: unless-stopped

  # Одноразовый контейнер: создаёт бакет для артефактов
  minio_init:
    image: amazon/aws-cli:2.27.49
    depends_on:
      minio:
        condition: service_started
    entrypoint: >
      /bin/sh -c "
      for i in $$(seq 1 30); do
        aws --endpoint-url http://minio:9000 s3api head-bucket --bucket ${MLFLOW_BUCKET:-mlflow} >/dev/null 2>&1 && exit 0;
        aws --endpoint-url http://minio:9000 s3 mb s3://${MLFLOW_BUCKET:-mlflow} && exit 0;
        sleep 2;
      done; exit 1"
    environment:
      AWS_ACCESS_KEY_ID: ${MINIO_ROOT_USER:-minioadmin}
      AWS_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin}
      AWS_DEFAULT_REGION: us-east-1
    networks:
      - mlopslabs_network
    restart: "no"

  # Tracking Server + UI
  mlflow:
    build:
      context: ./mlflow
      dockerfile: Dockerfile
    image: ${MLFLOW_IMAGE:-mlflow-server:local}
    depends_on:
      mlflow_db:
        condition: service_healthy
      minio_init:
        condition: service_completed_successfully
    environment:
      MLFLOW_S3_ENDPOINT_URL: http://minio:9000
      AWS_ACCESS_KEY_ID: ${MINIO_ROOT_USER:-minioadmin}
      AWS_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin}
    # --serve-artifacts: сервер проксирует артефакты, клиентам не нужны ключи от MinIO
    command: >
      mlflow server
      --host 0.0.0.0
      --port 5000
      --backend-store-uri postgresql://${MLFLOW_DB_USER:-mlflow}:${MLFLOW_DB_PASSWORD:-mlflow}@mlflow_db:5432/${MLFLOW_DB_NAME:-mlflow}
      --artifacts-destination s3://${MLFLOW_BUCKET:-mlflow}/
      --serve-artifacts
    ports:
      - "${MLFLOW_PORT:-5000}:5000"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/health').read()\" || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - mlopslabs_network
    restart: unless-stopped

volumes:
  postgres_data:
  rabbitmq_data:
  mlflow_db_data:
  minio_data:

networks:
  mlopslabs_network:
    driver: bridge
