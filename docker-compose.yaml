services:
  postgres:
    image: postgres:16-alpine
    container_name: postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: mlops_labs
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d mlops_labs"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 3s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
        reservations:
          cpus: "0.25"
          memory: 256M
    networks:
      - mlopslabs_network
    restart: unless-stopped

  app:
    image: ${APP_IMAGE:-mlops-labs:local}
    pull_policy: never
    build:
      context: .
      dockerfile: Dockerfile
      args:
        APP_VERSION: ${APP_VERSION:-}
        VCS_REF: ${VCS_REF:-local}
    container_name: mlops_labs_app
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz').read()\" || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
        reservations:
          cpus: "0.25"
          memory: 128M
    #no .env file yet, so we set environment variables directly in the docker-compose.yaml
    environment:
      DATABASE_URL: "postgresql+asyncpg://postgres:postgres@postgres:5432/mlops_labs"
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    networks:
      - mlopslabs_network
    restart: unless-stopped

  # ---------- MLflow ----------
  # Backend Store: метаданные (эксперименты, runs, параметры, метрики) -> отдельный PostgreSQL
  mlflow_db:
    image: postgres:16-alpine
    container_name: mlflow_db
    environment:
      POSTGRES_USER: ${MLFLOW_DB_USER:-mlflow}
      POSTGRES_PASSWORD: ${MLFLOW_DB_PASSWORD:-mlflow}
      POSTGRES_DB: ${MLFLOW_DB_NAME:-mlflow}
    volumes:
      - mlflow_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${MLFLOW_DB_USER:-mlflow} -d ${MLFLOW_DB_NAME:-mlflow}"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 3s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - mlopslabs_network
    restart: unless-stopped

  # Artifact Store: модели, файлы, графики -> S3-совместимое хранилище MinIO
  minio:
    image: rustfs/rustfs:latest
    container_name: mlflow_minio
    environment:
      RUSTFS_ACCESS_KEY: ${MINIO_ROOT_USER:-minioadmin}
      RUSTFS_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin}
    ports:
      - "9100:9000"   # S3 API
      - "9101:9001"   # веб-консоль
    volumes:
      - minio_data:/data
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - mlopslabs_network
    restart: unless-stopped

  # Одноразовый контейнер: создаёт бакет для артефактов
  minio_init:
    image: amazon/aws-cli:latest
    depends_on:
      minio:
        condition: service_started
    entrypoint: >
      /bin/sh -c "                                                                                                                                             
      for i in $$(seq 1 30); do                                                                                                                                
        aws --endpoint-url http://minio:9000 s3 mb s3://${MLFLOW_BUCKET:-mlflow} && exit 0;                                                                    
        sleep 2;                                                                                                                                               
      done; exit 1"
    environment:
      AWS_ACCESS_KEY_ID: ${MINIO_ROOT_USER:-minioadmin}
      AWS_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin}
      AWS_DEFAULT_REGION: us-east-1
    networks:
      - mlopslabs_network
    restart: "no"

  # Tracking Server + UI
  mlflow:
    build:
      context: ./mlflow
      dockerfile: Dockerfile
    image: mlflow-server:local
    container_name: mlflow_server
    depends_on:
      mlflow_db:
        condition: service_healthy
      minio_init:
        condition: service_completed_successfully
    environment:
      MLFLOW_S3_ENDPOINT_URL: http://minio:9000
      AWS_ACCESS_KEY_ID: ${MINIO_ROOT_USER:-minioadmin}
      AWS_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin}
    # --serve-artifacts: сервер проксирует артефакты, клиентам не нужны ключи от MinIO
    command: >
      mlflow server
      --host 0.0.0.0
      --port 5000
      --backend-store-uri postgresql://${MLFLOW_DB_USER:-mlflow}:${MLFLOW_DB_PASSWORD:-mlflow}@mlflow_db:5432/${MLFLOW_DB_NAME:-mlflow}
      --artifacts-destination s3://${MLFLOW_BUCKET:-mlflow}/
      --serve-artifacts
    ports:
      - "5000:5000"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/health').read()\" || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - mlopslabs_network
    restart: unless-stopped

volumes:
  postgres_data:
  mlflow_db_data:
  minio_data:

networks:
  mlopslabs_network:
    driver: bridge
