name: CD

on:
  push:
    branches: [main]
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: cd-${{ github.ref }}
  cancel-in-progress: false

env:
  UV_VERSION: "0.12.17"
  PYTHON_VERSION: "3.12"

jobs:
  verify:
    name: Check release
    uses: ./.github/workflows/ci.yml
    with:
      full_checks: true

  publish:
    name: Build and publish
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@94527f2e458b27549849d47d273a16bec83a01e9
        with:
          version: ${{ env.UV_VERSION }}
          python-version: ${{ env.PYTHON_VERSION }}
          enable-cache: true

      - name: Calculate and validate image version
        id: image
        run: uv run --no-project --python 3.12 python scripts/image_metadata.py

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f

      - name: Build application image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8
        with:
          context: .
          load: true
          push: false
          tags: ${{ steps.image.outputs.tags }}
          build-args: |
            APP_VERSION=${{ steps.image.outputs.app_version }}
            VCS_REF=${{ github.sha }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build the MLflow server image
        run: docker compose build mlflow

      - name: Check graceful worker shutdown in Linux
        env:
          IMAGE_TAGS: ${{ steps.image.outputs.tags }}
          RUN_RABBITMQ_INTEGRATION: "1"
          RUN_WORKER_DOCKER_TESTS: "1"
        shell: bash
        run: |
          export MLOPS_TEST_IMAGE="${IMAGE_TAGS%%$'\n'*}"
          uv run --locked pytest tests/test_rabbitmq_integration.py::test_linux_sigterm_drains_inflight_before_ack -q --junitxml=shutdown-results.xml

      - name: Save shutdown test report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: shutdown-test-report
          path: shutdown-results.xml
          if-no-files-found: warn
          retention-days: 14

      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish application image
        env:
          IMAGE_TAGS: ${{ steps.image.outputs.tags }}
        shell: bash
        run: |
          while IFS= read -r tag; do
            docker push "$tag"
            printf 'Published `%s`\n\n' "$tag" >> "$GITHUB_STEP_SUMMARY"
          done <<< "$IMAGE_TAGS"
