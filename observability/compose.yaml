services:
  alloy:
    image: grafana/alloy:${ALLOY_VERSION:-v1.10.2}
    profiles: [logs, observability]
    command: [run, --storage.path=/var/lib/alloy, /etc/alloy/config.alloy]
    environment:
      OBS_PROJECT: ${COMPOSE_PROJECT_NAME}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./alloy/config.alloy:/etc/alloy/config.alloy:ro
      - alloy_data:/var/lib/alloy
    mem_limit: 128m
    networks: [mlopslabs_network]

  loki:
    image: grafana/loki:${LOKI_VERSION:-3.5.3}
    profiles: [logs, observability]
    command: [-config.file=/etc/loki/config.yaml]
    volumes:
      - ./loki.yaml:/etc/loki/config.yaml:ro
      - loki_data:/loki
    healthcheck:
      test: [CMD, wget, -q, -O, /dev/null, 'http://127.0.0.1:3100/ready']
      interval: 5s
      timeout: 3s
      retries: 15
    mem_limit: 256m
    networks: [mlopslabs_network]

  otel-collector:
    image: otel/opentelemetry-collector:${OTEL_COLLECTOR_VERSION:-0.133.0}
    profiles: [traces, metrics, observability]
    command: [--config=/etc/otelcol/config.yaml]
    environment:
      GOMEMLIMIT: 82MiB
    ports:
      - '127.0.0.1:${OTEL_HOST_PORT:-4318}:4318'
    volumes:
      - ./otel-collector.yaml:/etc/otelcol/config.yaml:ro
    mem_limit: 128m
    networks: [mlopslabs_network]

  tempo:
    image: grafana/tempo:${TEMPO_VERSION:-2.8.2}
    profiles: [traces, observability]
    command: [-config.file=/etc/tempo/config.yaml]
    environment:
      GOMEMLIMIT: 290MiB
    volumes:
      - ./tempo.yaml:/etc/tempo/config.yaml:ro
      - tempo_data:/var/tempo
    healthcheck:
      test: [CMD, wget, -q, -O, /dev/null, 'http://127.0.0.1:3200/ready']
      interval: 5s
      timeout: 3s
      retries: 20
    mem_limit: 416m
    networks: [mlopslabs_network]

  prometheus:
    image: prom/prometheus:${PROMETHEUS_VERSION:-v3.5.0}
    profiles: [metrics, observability]
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=2d
      - --storage.tsdb.retention.size=1GB
      - --web.enable-otlp-receiver
      - --enable-feature=exemplar-storage
    ports:
      - '127.0.0.1:${PROMETHEUS_PORT:-9090}:9090'
    configs:
      - source: prometheus_config
        target: /etc/prometheus/prometheus.yml
      - source: prometheus_rules
        target: /etc/prometheus/pipeline.rules.yml
    volumes:
      - prometheus_data:/prometheus
    healthcheck:
      test: [CMD, wget, -q, -O, /dev/null, 'http://127.0.0.1:9090/-/ready']
      interval: 5s
      timeout: 3s
      retries: 12
    mem_limit: 256m
    networks: [mlopslabs_network]

  grafana:
    image: grafana/grafana:${GRAFANA_VERSION:-12.1.1}
    profiles: [observability]
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-local-grafana}
      GF_DATABASE_WAL: 'true'
      GF_ANALYTICS_REPORTING_ENABLED: 'false'
      GF_ANALYTICS_CHECK_FOR_UPDATES: 'false'
      GF_ALERTING_ENABLED: 'false'
      GF_UNIFIED_ALERTING_ENABLED: 'true'
    ports:
      - '127.0.0.1:${GRAFANA_PORT:-3000}:3000'
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/etc/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    healthcheck:
      test: [CMD, wget, -q, -O, /dev/null, 'http://127.0.0.1:3000/api/health']
      start_period: 2m
      interval: 5s
      timeout: 3s
      retries: 15
    mem_limit: 256m
    networks: [mlopslabs_network]

configs:
  prometheus_config:
    content: |
      global:
        scrape_interval: 2s
        evaluation_interval: 5s
      rule_files:
        - /etc/prometheus/pipeline.rules.yml
      scrape_configs:
        - job_name: rabbitmq
          metrics_path: /metrics/detailed
          params:
            family: [queue_coarse_metrics]
          static_configs:
            - targets: [rabbitmq:15692]
          metric_relabel_configs:
            - source_labels: [queue]
              regex: '\Q${RABBITMQ_QUEUE:-mlops.tasks}\E'
              target_label: queue_role
              replacement: work
            - source_labels: [queue]
              regex: '\Q${RABBITMQ_DLQ_QUEUE:-mlops.tasks.dlq}\E'
              target_label: queue_role
              replacement: dlq
            - source_labels: [queue_role]
              regex: 'work|dlq'
              action: keep
  prometheus_rules:
    content: |
      groups:
        - name: pipeline
          rules:
            - record: mlops_queue_limit
              expr: vector(${RABBITMQ_MAX_QUEUE_LENGTH:-10})
            - alert: TaskQueueNearCapacity
              expr: avg_over_time(rabbitmq_detailed_queue_messages_ready{queue_role="work"}[10s]) > 0.9 * scalar(mlops_queue_limit > 0)
              for: 1m
              labels:
                severity: warning
              annotations:
                summary: Очередь задач заполнена больше чем на 90%
            - alert: TaskDeadLetters
              expr: rabbitmq_detailed_queue_messages_ready{queue_role="dlq"} > 0
              for: 10s
              labels:
                severity: warning
              annotations:
                summary: В DLQ есть задачи

volumes:
  alloy_data:
  loki_data:
  tempo_data:
  prometheus_data:
  grafana_data:
